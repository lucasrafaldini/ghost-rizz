name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Install ExifTool
      run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

    - name: Check Formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted. Run 'gofmt -s -w .'"
          gofmt -d .
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: latest

    - name: Run Tests & Coverage
      run: |
        go test ./... -coverprofile=coverage.out
        go tool cover -func=coverage.out

    - name: Enforce Coverage Threshold
      run: |
        COVERAGE=$(go tool cover -func=coverage.out | grep total: | awk '{print $3}' | tr -d '%')
        echo "Total coverage: $COVERAGE%"
        # Requiring 85%+ due to unreachable extreme edge-case error branches and exiftool dependencies
        if (( $(echo "$COVERAGE < 85.0" | bc -l) )); then
          echo "Coverage is below 85.0% ($COVERAGE%)"
          exit 1
        fi
