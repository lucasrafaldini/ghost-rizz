name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.2'

    - name: Install ExifTool
      run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl

    - name: Check Formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go code is not formatted. Run 'gofmt -s -w .'"
          gofmt -d .
          exit 1
        fi

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: v1.61.0

    - name: Run Tests & Enforce Coverage
      run: |
        go test ./... -coverprofile=coverage.out
        go tool cover -func=coverage.out > coverage_report.txt
        cat coverage_report.txt
        COVERAGE=$(grep "total:" coverage_report.txt | awk '{print $3}' | tr -d '%')
        echo "Total coverage: $COVERAGE%"
        # Requiring 85%+ due to unreachable extreme edge-case error branches and exiftool dependencies
        awk -v cov="$COVERAGE" 'BEGIN { if (cov < 85.0) { print "Coverage is below 85.0% (" cov "%)"; exit 1 } }'
